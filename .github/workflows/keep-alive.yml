name: Keep alive

# Supabase (free) uspí projekt po 7 dnech nečinnosti. Tohle ho každý den „pošťouchne“
# přes /api/health a zároveň ověří, že produkce běží.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 30 https://maturify.vercel.app/api/health; then exit 0; fi
            sleep 20
          done
          exit 1
